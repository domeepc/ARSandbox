# Copyright (c) 2016 Oliver Kreylos

section SARndbox
	# Every calibration file the sandbox writes -- BoxLayout.txt and
	# ProjectorMatrix.dat -- is copied here as well as to the directory the
	# running binary reads. Without this the tracked copy silently falls behind
	# the real one, and the repository stops describing the actual rig.
	# Leave empty to disable mirroring.
	calibrationMirrorDir /home/dome/ARSandbox/config

	section Camera
		# Configuration parameters for Kinect v1
		compressDepthFrames true
		smoothDepthFrames false
	endsection

	# Water flow simulation grid.
	#
	# The grid is stretched over the base plane domain, whose extents are derived
	# from the four corners in BoxLayout.txt. For this sandbox that domain is
	# 69.64 x 87.43 cm, so the upstream default of 640x480 yields cells of
	# 0.1088 x 0.1821 cm -- 1.67 times longer along the box's long axis than
	# across it. That resolves flow features worse in one direction and makes
	# wave propagation direction-dependent.
	#
	# 512x643 squares the cells (0.1360 x 0.1360) AND costs less than the stock
	# grid: 0.86x the work. Squaring alone at full width (640x804) was 1.68x the
	# stock cost and made the simulation fall behind -- it printed
	# "Ran out of time by ..." and ran in slow motion. The CFL step limit really
	# is set by the smaller cell dimension and so was unchanged by squaring, but
	# 1.68x the cells still costs frame time directly, and a slower frame needs
	# MORE simulated time per frame, so the two compound.
	#
	# Dropping the width instead makes every cell larger, which raises the stable
	# step as well as cutting cell count, so the saving is better than linear.
	#
	# NOTE: these numbers follow from BoxLayout.txt (domain 69.64 x 87.43 cm).
	# If the sandbox is re-measured, recompute the height as
	# width * yExtent / xExtent to keep the cells square.
	waterTableSize (512, 643)

	# Raising the cap is free when it is not reached: the loop stops as soon as
	# it has simulated the frame's worth of time. It only bounds how far behind
	# the simulation is allowed to fall before giving up for that frame.
	waterMaxSteps 50

	# Depth frame filtering.
	#
	# Upstream defaults (30 slots, hysteresis 0.1) trade responsiveness for a
	# still surface: 30 slots at the Kinect v1's 30 Hz is a full second of
	# latency, and because unstable pixels freeze at their previous value rather
	# than ramping, reshaping sand gives ~1 s of stale surface followed by a jump.
	#
	# Halving the slot count halves that to ~0.5 s. Noise rises by about sqrt(2),
	# but the two spatial 1-2-1 binomial passes in FrameFilter absorb most of it,
	# and anti-aliased contour lines render the remainder as a gentle wobble
	# rather than a flickering stipple.
	#
	# hysteresis is in cm and quantizes the output surface. At the 0.75 cm
	# contour spacing the 0.1 default is 13% of a contour interval, which becomes
	# visible as snapping once contour lines are anti-aliased.
	#
	# NOTE: numAveragingSlots must not exceed ~32. FrameFilter accumulates
	# sum-of-squares in a 32-bit unsigned int, and its stability test overflows
	# above that, which makes pixels stable or unstable at random.
	numAveragingSlots 15
	minNumSamples 7
	maxVariance 3
	hysteresis 0.05
endsection
