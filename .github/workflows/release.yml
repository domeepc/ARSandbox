name: Release

# Builds a source archive of the sandbox and self-contained .deb/.rpm
# packages with the whole app (Vrui + its Kinect package + the sandbox +
# the control panel) prebuilt.
#
# The .deb/.rpm builds take many minutes (Vrui and Kinect are large out-of-tree
# toolkits) and, like the rest of this workflow, cannot be tested against a
# real Kinect — there is no hardware in CI. install.sh remains the
# from-source path and is what the release notes lead with; the packages are
# a convenience for people who would rather not wait for a local build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: write

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify the installer parses
        run: bash -n install.sh

      - name: Archive
        run: |
          tar --exclude-vcs \
              --exclude='sarndbox/o' --exclude='sarndbox/bin' --exclude='sarndbox/d' \
              --exclude='control-panel/build' \
              -czf arsandbox-source.tar.gz \
              sarndbox control-panel config docs scripts install.sh README.md

      - uses: actions/upload-artifact@v4
        with:
          name: arsandbox-source
          path: arsandbox-source.tar.gz

  package-deb:
    name: Package (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake ninja-build git wget \
            libudev-dev libdbus-1-dev libusb-1.0-0-dev zlib1g-dev libssl-dev \
            libpng-dev libjpeg-dev libtiff-dev libasound2-dev libspeex-dev libopenal-dev \
            libv4l-dev libdc1394-dev libtheora-dev libbluetooth-dev libfreetype-dev \
            libxi-dev libxrandr-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            fonts-freefont-ttf \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            qml6-module-qt-labs-settings \
            xvfb \
            ruby ruby-dev rubygems
          sudo gem install --no-document fpm

      - name: Determine toolchain version for cache key
        id: toolchain
        run: echo "gcc=$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache Vrui/Kinect build
        # Vrui and Kinect are pinned external toolkits (see packaging/build.sh)
        # that take most of this job's time to compile from source and rarely
        # change. Caching the built source tree (not just the tarballs) skips
        # recompiling them entirely when nothing relevant changed. Keyed on the
        # compiler version too, not just the OS label: a runner image update
        # can bump the system GCC under the same "ubuntu-24.04" name, and a
        # stale cache built with a different compiler would go unnoticed
        # instead of failing loudly.
        uses: actions/cache@v4
        with:
          path: stageroot.src
          key: vrui-kinect-${{ runner.os }}-gcc${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('packaging/build.sh') }}

      - name: Build and stage
        run: STAGEROOT="$PWD/stageroot" bash packaging/build.sh

      - name: Smoke test the control panel
        # Qt Quick Controls' styles (Fusion, the Linux desktop default) pull in
        # further QML modules (Templates, WorkerScript, ...) that apt does not
        # treat as hard dependencies of qml6-module-qtquick-controls itself,
        # since Debian's packaging has no notion of "this QML plugin imports
        # that other QML plugin at runtime" - only the C++ libraries it links
        # against. Two missing modules have already reached a shipped release
        # this way (WorkerScript, then Templates); actually launching the
        # built binary here, in the same environment the release ships from,
        # catches the next one before a release does instead of after.
        run: |
          test_mode() {
            xvfb-run -a stageroot/opt/arsandbox/bin/sandbox-control "$@" >smoke.log 2>&1 &
            PANEL_PID=$!
            sleep 3
            kill "$PANEL_PID" 2>/dev/null || true
            wait "$PANEL_PID" 2>/dev/null || true
            if grep -qiE "not found|unavailable|failed to load|QQmlApplicationEngine failed" smoke.log; then
              echo "sandbox-control $* failed to start cleanly:"
              cat smoke.log
              exit 1
            fi
          }
          test_mode --error smoke-test
          test_mode -p /tmp/smoke.pipe

      - name: Package
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          ln -s /opt/arsandbox/bin/sandbox-control stageroot/usr/bin/sandbox-control
          fpm -s dir -t deb -n arsandbox -v "$VERSION" \
            --maintainer "Domagoj Milardovic <domagoj.milardovic@gmail.com>" \
            --license GPL-2.0 --url https://github.com/${{ github.repository }} \
            --description "Augmented Reality Sandbox: Kinect depth camera + projector topography, prebuilt with Vrui and the Kinect package" \
            --depends libudev1 --depends libdbus-1-3 --depends libusb-1.0-0 \
            --depends zlib1g --depends libssl3t64 --depends libpng16-16t64 \
            --depends libjpeg-turbo8 --depends libtiff6 --depends libasound2 \
            --depends libspeex1 --depends libopenal1 --depends libv4l-0t64 \
            --depends libdc1394-25 --depends libtheora0 --depends libbluetooth3 \
            --depends libfreetype6 --depends libxi6 --depends libxrandr2 \
            --depends libgl1 --depends libglu1-mesa --depends fonts-freefont-ttf \
            --depends libqt6quick6 --depends libqt6qml6 --depends qml6-module-qtquick \
            --depends qml6-module-qtquick-controls --depends qml6-module-qtquick-layouts \
            --depends qml6-module-qtquick-window --depends qml6-module-qtqml-workerscript \
            --depends qml6-module-qtquick-templates --depends qml6-module-qt-labs-settings \
            --after-install packaging/udev-reload.sh --after-remove packaging/udev-reload.sh \
            -C stageroot opt usr

      - uses: actions/upload-artifact@v4
        with:
          name: arsandbox-deb
          path: '*.deb'

  package-deb-qt5:
    name: Package (.deb, Qt 5)
    runs-on: ubuntu-22.04
    # Ubuntu did not package Qt 6 until 22.04 (and only in universe, not
    # main), so this job targets older Ubuntu/Debian releases that only ever
    # had Qt 5 - see install.sh's own qt6-base-dev/qtbase5-dev fallback.
    # GitHub retired its ubuntu-20.04 runner, so this still builds on
    # ubuntu-22.04; only the Qt packages installed and linked against differ
    # from package-deb, and the runtime --depends below name Ubuntu 22.04's
    # (pre-t64) library packages to match what the binary is actually linked
    # against.
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake ninja-build git wget \
            libudev-dev libdbus-1-dev libusb-1.0-0-dev zlib1g-dev libssl-dev \
            libpng-dev libjpeg-dev libtiff-dev libasound2-dev libspeex-dev libopenal-dev \
            libv4l-dev libdc1394-dev libtheora-dev libbluetooth-dev libfreetype-dev \
            libxi-dev libxrandr-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            fonts-freefont-ttf \
            qtbase5-dev qtdeclarative5-dev qml-module-qtquick2 \
            qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 \
            qml-module-qtquick-templates2 qml-module-qt-labs-settings \
            xvfb \
            ruby ruby-dev rubygems
          sudo gem install --no-document fpm

      - name: Determine toolchain version for cache key
        id: toolchain
        run: echo "gcc=$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache Vrui/Kinect build
        uses: actions/cache@v4
        with:
          path: stageroot.src
          key: vrui-kinect-${{ runner.os }}-gcc${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('packaging/build.sh') }}

      - name: Build and stage
        run: STAGEROOT="$PWD/stageroot" bash packaging/build.sh

      - name: Smoke test the control panel
        run: |
          test_mode() {
            xvfb-run -a stageroot/opt/arsandbox/bin/sandbox-control "$@" >smoke.log 2>&1 &
            PANEL_PID=$!
            sleep 3
            kill "$PANEL_PID" 2>/dev/null || true
            wait "$PANEL_PID" 2>/dev/null || true
            if grep -qiE "not found|unavailable|failed to load|QQmlApplicationEngine failed" smoke.log; then
              echo "sandbox-control $* failed to start cleanly:"
              cat smoke.log
              exit 1
            fi
          }
          test_mode --error smoke-test
          test_mode -p /tmp/smoke.pipe

      - name: Package
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          ln -s /opt/arsandbox/bin/sandbox-control stageroot/usr/bin/sandbox-control
          fpm -s dir -t deb -n arsandbox -v "$VERSION+qt5" \
            --maintainer "Domagoj Milardovic <domagoj.milardovic@gmail.com>" \
            --license GPL-2.0 --url https://github.com/${{ github.repository }} \
            --description "Augmented Reality Sandbox: Kinect depth camera + projector topography, prebuilt with Vrui and the Kinect package (Qt 5 build, for Ubuntu releases without Qt 6)" \
            --depends libudev1 --depends libdbus-1-3 --depends libusb-1.0-0 \
            --depends zlib1g --depends libssl3 --depends libpng16-16 \
            --depends libjpeg-turbo8 --depends libtiff5 --depends libasound2 \
            --depends libspeex1 --depends libopenal1 --depends libv4l-0 \
            --depends libdc1394-25 --depends libtheora0 --depends libbluetooth3 \
            --depends libfreetype6 --depends libxi6 --depends libxrandr2 \
            --depends libgl1 --depends libglu1-mesa --depends fonts-freefont-ttf \
            --depends libqt5quick5 --depends libqt5qml5 --depends qml-module-qtquick2 \
            --depends qml-module-qtquick-controls2 --depends qml-module-qtquick-layouts \
            --depends qml-module-qtquick-window2 --depends qml-module-qtquick-templates2 \
            --depends qml-module-qt-labs-settings \
            --after-install packaging/udev-reload.sh --after-remove packaging/udev-reload.sh \
            -C stageroot opt usr

      - uses: actions/upload-artifact@v4
        with:
          name: arsandbox-qt5-deb
          path: '*.deb'

  package-rpm:
    name: Package (.rpm)
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y gcc-c++ cmake ninja-build git wget rpm-build redhat-rpm-config \
            systemd-devel dbus-devel libusbx-devel zlib-devel openssl-devel \
            libpng-devel libjpeg-turbo-devel libtiff-devel alsa-lib-devel speex-devel \
            openal-soft-devel libv4l-devel libdc1394-devel libtheora-devel bluez-libs-devel \
            freetype-devel libXi-devel libXrandr-devel mesa-libGL-devel mesa-libGLU-devel \
            gnu-free-mono-fonts gnu-free-sans-fonts gnu-free-serif-fonts \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            ruby ruby-devel rubygems
          gem install --no-document fpm

      - name: Determine toolchain version for cache key
        id: toolchain
        run: echo "gcc=$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache Vrui/Kinect build
        uses: actions/cache@v4
        with:
          path: stageroot.src
          key: vrui-kinect-${{ runner.os }}-gcc${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('packaging/build.sh') }}

      - name: Build and stage
        run: STAGEROOT="$PWD/stageroot" bash packaging/build.sh

      - name: Package
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          ln -s /opt/arsandbox/bin/sandbox-control stageroot/usr/bin/sandbox-control
          fpm -s dir -t rpm -n arsandbox -v "$VERSION" \
            --license GPLv2 --url https://github.com/${{ github.repository }} \
            --description "Augmented Reality Sandbox: Kinect depth camera + projector topography, prebuilt with Vrui and the Kinect package" \
            --depends systemd-libs --depends dbus-libs --depends libusbx \
            --depends zlib --depends openssl-libs --depends libpng \
            --depends libjpeg-turbo --depends libtiff --depends alsa-lib \
            --depends speex --depends openal-soft --depends libv4l \
            --depends libdc1394 --depends libtheora --depends bluez-libs \
            --depends freetype --depends libXi --depends libXrandr \
            --depends mesa-libGL --depends mesa-libGLU \
            --depends gnu-free-mono-fonts --depends gnu-free-sans-fonts --depends gnu-free-serif-fonts \
            --depends qt6-qtdeclarative \
            --after-install packaging/udev-reload.sh --after-remove packaging/udev-reload.sh \
            -C stageroot opt usr

      - uses: actions/upload-artifact@v4
        with:
          name: arsandbox-rpm
          path: '*.rpm'

  release:
    name: Publish
    needs: [source, package-deb, package-deb-qt5, package-rpm]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Installing

            Download `arsandbox-source.tar.gz`, unpack it and run:

            ```bash
            ./install.sh
            ```

            That installs the build dependencies, builds and installs Vrui and
            its Kinect package if they are not already present, then builds the
            sandbox and the control panel. Vrui is built from the author's
            release rather than vendored here.

            Prefer not to build locally? Download `arsandbox_<version>_amd64.deb`
            (Debian/Ubuntu) or `arsandbox-<version>.x86_64.rpm` (Fedora)
            instead. Each bundles the whole app — Vrui, the Kinect package, the
            sandbox and the control panel — under `/opt/arsandbox`, with
            `arsandbox` and `sandbox-control` on your PATH:

            ```bash
            sudo apt install ./arsandbox_<version>_amd64.deb   # Debian/Ubuntu
            sudo dnf install ./arsandbox-<version>.x86_64.rpm  # Fedora
            ```

            On Ubuntu releases without Qt 6 (e.g. 20.04), use the Qt 5 build
            instead:

            ```bash
            sudo apt install ./arsandbox_<version>+qt5_amd64.deb
            ```

            Like the rest of this workflow, the packages are built without a
            Kinect attached and are not hardware-tested in CI; if one doesn't
            work on your machine, `install.sh` is the fallback.
