# Vrui tool bindings for the Augmented Reality Sandbox.
#
# Vrui's stock desktop bindings put navigation on almost every input: left drag
# rotates the view, the scroll wheel zooms, and q/a/d/s/w/Space fly the camera.
# On a sandbox that is not useful and is actively harmful -- any of them moves
# the projected map off the sand, and a visitor leaning on the keyboard can
# wreck a calibrated projection with no obvious way back.
#
# This replaces the default tool set with the menu tool alone, so right click
# opens the sandbox's menu and nothing else does anything.
#
# Merge it by starting the sandbox with:
#   ./bin/SARndbox -mergeConfig <path to this file>
# scripts/run-sandbox.sh does this already.

section Vrui
	section Desktop
		section Tools
			section DefaultTools
				# Vrui names application event tools by the order the application
				# registers them, not by the name passed to addEventTool. Sandbox
				# registers "Pause Topography" first and "Show Control Menu"
				# second, so class 1 is the latter. Inserting another
				# addEventTool call before it in Sandbox.cpp moves this number.
				#
				# Right click raises the sandbox's "Show Control Menu" event,
				# which pops up the control panel's Qt menu at the pointer. This
				# replaces Vrui's own RayMenuTool: a GLMotif menu is drawn into
				# the projected image, where it lands on the sand and is painted
				# over by the topography.
				section MenuTool
					toolClass VruiApplicationEventToolClass1
					bindings ((Mouse, Mouse3))
				endsection

				# Left click still has to work the widgets of any GLMotif dialog
				# Vrui itself puts on screen.
				section MouseGuiTool
					toolClass WidgetTool
					bindings ((Mouse, Mouse1))
				endsection

				# Everything else that the stock configuration binds --
				# MouseNavTool, FPSNavTool, MouseScrollTool -- is deliberately
				# absent. Removing a section here is what unbinds it.
			endsection
		endsection
	endsection
endsection
