section SARndbox
	section Camera
		# Configuration parameters for Kinect v1
		compressDepthFrames true
		smoothDepthFrames false
	endsection

	# Water flow simulation grid.
	#
	# The grid is stretched over the base plane domain, whose extents are derived
	# from the four corners in BoxLayout.txt. For this sandbox that domain is
	# 69.64 x 87.43 cm, so the upstream default of 640x480 yields cells of
	# 0.1088 x 0.1821 cm -- 1.67 times longer along the box's long axis than
	# across it. That resolves flow features worse in one direction and makes
	# wave propagation direction-dependent.
	#
	# 640x804 squares the cells (0.1088 x 0.1087). This costs 1.67 times more
	# cells but almost no extra simulation steps, because the CFL step limit is
	# set by the SMALLER cell dimension, which is unchanged.
	#
	# NOTE: these numbers follow from BoxLayout.txt. If the sandbox is
	# re-measured, recompute the height as 640 * yExtent / xExtent.
	waterTableSize (640, 804)
	waterMaxSteps 30

	# Depth frame filtering.
	#
	# Upstream defaults (30 slots, hysteresis 0.1) trade responsiveness for a
	# still surface: 30 slots at the Kinect v1's 30 Hz is a full second of
	# latency, and because unstable pixels freeze at their previous value rather
	# than ramping, reshaping sand gives ~1 s of stale surface followed by a jump.
	#
	# Halving the slot count halves that to ~0.5 s. Noise rises by about sqrt(2),
	# but the two spatial 1-2-1 binomial passes in FrameFilter absorb most of it,
	# and anti-aliased contour lines render the remainder as a gentle wobble
	# rather than a flickering stipple.
	#
	# hysteresis is in cm and quantizes the output surface. At the 0.75 cm
	# contour spacing the 0.1 default is 13% of a contour interval, which becomes
	# visible as snapping once contour lines are anti-aliased.
	#
	# NOTE: numAveragingSlots must not exceed ~32. FrameFilter accumulates
	# sum-of-squares in a 32-bit unsigned int, and its stability test overflows
	# above that, which makes pixels stable or unstable at random.
	numAveragingSlots 15
	minNumSamples 7
	maxVariance 3
	hysteresis 0.05
endsection
