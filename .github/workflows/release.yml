name: Release

# Builds a source archive of the sandbox and self-contained .deb/.rpm
# packages with the whole app (Vrui + its Kinect package + the sandbox +
# the control panel) prebuilt.
#
# The .deb/.rpm builds take many minutes (Vrui and Kinect are large out-of-tree
# toolkits) and, like the rest of this workflow, cannot be tested against a
# real Kinect — there is no hardware in CI. install.sh remains the
# from-source path and is what the release notes lead with; the packages are
# a convenience for people who would rather not wait for a local build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: write

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Record the checked-out commit
        # github.sha is the commit the run started from, which on a manual run
        # naming a tag is the branch head rather than the tag's commit - so a
        # package built from the tag would advertise a hash it was not built
        # from. Everything that names a commit uses this instead.
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the installer parses
        run: bash -n install.sh

      - name: Archive
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The archive carries no .git, so install.sh cannot ask git which
          # version it is building (see its SANDBOX_VERSION): leave the tag in
          # a file for it, or every install from a release tarball would call
          # itself "dev".
          printf '%s\n' "$TAG" > VERSION
          tar --exclude-vcs \
              --exclude='sarndbox/o' --exclude='sarndbox/bin' --exclude='sarndbox/d' \
              --exclude='control-panel/build' \
              -czf arsandbox-source.tar.gz \
              sarndbox control-panel config docs scripts install.sh README.md VERSION

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arsandbox-source
          path: arsandbox-source.tar.gz

  package-deb:
    name: Package (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake ninja-build git wget \
            libudev-dev libdbus-1-dev libusb-1.0-0-dev zlib1g-dev libssl-dev \
            libpng-dev libjpeg-dev libtiff-dev libasound2-dev libspeex-dev libopenal-dev \
            libv4l-dev libdc1394-dev libtheora-dev libbluetooth-dev libfreetype-dev \
            libxi-dev libxrandr-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            fonts-freefont-ttf \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            qml6-module-qt-labs-settings \
            xvfb \
            ruby ruby-dev rubygems
          sudo gem install --no-document fpm

      - name: Determine toolchain version for cache key
        id: toolchain
        run: echo "gcc=$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache Vrui/Kinect build
        # Vrui and Kinect are pinned external toolkits (see packaging/build.sh)
        # that take most of this job's time to compile from source and rarely
        # change. Caching the built source tree (not just the tarballs) skips
        # recompiling them entirely when nothing relevant changed. Keyed on the
        # compiler version too, not just the OS label: a runner image update
        # can bump the system GCC under the same "ubuntu-24.04" name, and a
        # stale cache built with a different compiler would go unnoticed
        # instead of failing loudly.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: stageroot.src
          key: vrui-kinect-${{ runner.os }}-gcc${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('packaging/build.sh') }}

      - name: Build and stage
        run: STAGEROOT="$PWD/stageroot" bash packaging/build.sh

      - name: Smoke test the control panel
        # Qt Quick Controls' styles (Fusion, the Linux desktop default) pull in
        # further QML modules (Templates, WorkerScript, ...) that apt does not
        # treat as hard dependencies of qml6-module-qtquick-controls itself,
        # since Debian's packaging has no notion of "this QML plugin imports
        # that other QML plugin at runtime" - only the C++ libraries it links
        # against. Two missing modules have already reached a shipped release
        # this way (WorkerScript, then Templates); actually launching the
        # built binary here, in the same environment the release ships from,
        # catches the next one before a release does instead of after.
        run: |
          test_mode() {
            xvfb-run -a stageroot/opt/arsandbox/bin/sandbox-control "$@" >smoke.log 2>&1 &
            PANEL_PID=$!
            sleep 3
            kill "$PANEL_PID" 2>/dev/null || true
            wait "$PANEL_PID" 2>/dev/null || true
            if grep -qiE "not found|unavailable|failed to load|QQmlApplicationEngine failed" smoke.log; then
              echo "sandbox-control $* failed to start cleanly:"
              cat smoke.log
              exit 1
            fi
          }
          test_mode --error smoke-test
          test_mode -p /tmp/smoke.pipe

      - name: Package
        # The tag reaches the shell through the environment, never spliced into
        # the script text: a manual run's tag input is whatever the person who
        # started it typed.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse HEAD)
          ln -s /opt/arsandbox/bin/sandbox-control stageroot/usr/bin/sandbox-control
          fpm -s dir -t deb -n arsandbox -v "$VERSION" \
            --maintainer "Domagoj Milardovic <domagoj.milardovic@gmail.com>" \
            --license GPL-2.0 --url https://github.com/${{ github.repository }} \
            --description "Augmented Reality Sandbox: Kinect depth camera + projector topography, prebuilt with Vrui and the Kinect package (git ${COMMIT::7})" \
            --depends libudev1 --depends libdbus-1-3 --depends libusb-1.0-0 \
            --depends zlib1g --depends libssl3t64 --depends libpng16-16t64 \
            --depends libjpeg-turbo8 --depends libtiff6 --depends libasound2 \
            --depends libspeex1 --depends libopenal1 --depends libv4l-0t64 \
            --depends libdc1394-25 --depends libtheora0 --depends libbluetooth3 \
            --depends libfreetype6 --depends libxi6 --depends libxrandr2 \
            --depends libgl1 --depends libglu1-mesa --depends fonts-freefont-ttf \
            --depends libqt6quick6 --depends libqt6qml6 --depends qml6-module-qtquick \
            --depends qml6-module-qtquick-controls --depends qml6-module-qtquick-layouts \
            --depends qml6-module-qtquick-window --depends qml6-module-qtqml-workerscript \
            --depends qml6-module-qtquick-templates --depends qml6-module-qt-labs-settings \
            --config-files /opt/arsandbox/etc/SARndbox-2.8 \
            --after-install packaging/udev-reload.sh --after-remove packaging/udev-reload.sh \
            -C stageroot opt usr

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arsandbox-deb
          path: '*.deb'

  package-deb-qt5:
    name: Package (.deb, Qt 5)
    runs-on: ubuntu-24.04
    # The Qt 5 build exists for Ubuntu releases too old for the Qt 6 package,
    # so what matters is not which Qt it links but how old a system the result
    # still runs on. A .deb only installs where its declared dependencies
    # resolve AND its binaries' glibc symbol versions exist, and both are fixed
    # by whatever the build ran on - so this builds on the OLDEST release we
    # claim to support, Ubuntu 18.04, and the result then also installs on
    # 20.04, which carries the same libssl1.1/libdc1394-22 names and a newer
    # glibc. Building on 22.04 instead produced a package that needed
    # GLIBC_2.34 and libssl3 and so installed on neither - the bug this
    # arrangement exists to prevent.
    #
    # 22.04 is deliberately NOT in that range: it renamed libssl1.1 to libssl3
    # and libdc1394-22 to libdc1394-25, so a bionic-built .deb cannot resolve
    # there however new its glibc is. 22.04 and 24.04 users take package-deb's
    # Qt 6 package or install.sh.
    #
    # The build runs in an ubuntu:18.04 Docker container rather than under this
    # job's `container:` key, because with `container:` the runner executes the
    # JavaScript actions (checkout, cache, upload-artifact) *inside* it too, and
    # their Node 20 runtime needs glibc 2.28+ which 18.04 does not have. Those
    # actions therefore stay on the host and only the compile steps go into the
    # container. fpm likewise runs on the host: it just reads the staged tree,
    # and 18.04's Ruby 2.5 is too old for current fpm.
    #
    # package-rpm can use `container:` directly because Fedora 40 is new enough
    # to run Node 20; that is the only reason the two jobs differ in shape.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Start the Ubuntu 18.04 build container
        run: |
          # Mounted at the same path as on the host so that paths baked into
          # the staging tree by build.sh mean the same thing on both sides.
          docker run -d --name bionic -v "$PWD:$PWD" -w "$PWD" \
            ubuntu@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98 \
            sleep infinity  # ubuntu:18.04
          docker exec bionic apt-get update
          # Bionic predates two of the dev-package renames package-deb uses:
          # libdc1394-dev was libdc1394-22-dev (install.sh carries the same
          # fallback), and libfreetype-dev was libfreetype6-dev.
          docker exec -e DEBIAN_FRONTEND=noninteractive bionic \
            apt-get install -y build-essential g++ cmake ninja-build git wget \
            libudev-dev libdbus-1-dev libusb-1.0-0-dev zlib1g-dev libssl-dev \
            libpng-dev libjpeg-dev libtiff-dev libasound2-dev libspeex-dev libopenal-dev \
            libv4l-dev libdc1394-22-dev libtheora-dev libbluetooth-dev libfreetype6-dev \
            libxi-dev libxrandr-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            fonts-freefont-ttf \
            qtbase5-dev qtdeclarative5-dev qml-module-qtquick2 \
            qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 \
            qml-module-qtquick-templates2 qml-module-qt-labs-settings \
            xvfb

      - name: Install fpm on the host
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems
          sudo gem install --no-document fpm

      - name: Determine toolchain version for cache key
        id: toolchain
        # The container's compiler, not the host's: that is what builds this.
        run: echo "gcc=$(docker exec bionic g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache Vrui/Kinect build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: stageroot.src
          # Keyed on bionic rather than runner.os, so this never shares a cache
          # entry with the host-built package-deb job.
          key: vrui-kinect-bionic-gcc${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('packaging/build.sh') }}

      - name: Build and stage
        run: |
          docker exec -e STAGEROOT="$PWD/stageroot" bionic bash packaging/build.sh
          # The container builds as root; hand the tree back to the runner user
          # so fpm and the cache action can read and write it on the host. The
          # .deb's own file ownership is unaffected - fpm sets root:root itself.
          sudo chown -R "$(id -u):$(id -g)" stageroot stageroot.src

      - name: Smoke test the control panel
        run: |
          docker exec bionic bash -c '
          test_mode() {
            xvfb-run -a stageroot/opt/arsandbox/bin/sandbox-control "$@" >smoke.log 2>&1 &
            PANEL_PID=$!
            sleep 3
            kill "$PANEL_PID" 2>/dev/null || true
            wait "$PANEL_PID" 2>/dev/null || true
            if grep -qiE "not found|unavailable|failed to load|QQmlApplicationEngine failed" smoke.log; then
              echo "sandbox-control $* failed to start cleanly:"
              cat smoke.log
              exit 1
            fi
          }
          test_mode --error smoke-test
          test_mode -p /tmp/smoke.pipe
          '

      - name: Verify the result actually runs on 18.04
        # The failure this job exists to prevent is silent: a package that
        # builds and smoke-tests fine but needs a glibc newer than the target's.
        # Assert it directly against 18.04's 2.27 rather than trusting that the
        # container was used everywhere it should have been.
        run: |
          MAXGLIBC=$(objdump -T stageroot/opt/arsandbox/bin/SARndbox |
            grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest glibc symbol version required: $MAXGLIBC"
          if [ "$(printf '%s\nGLIBC_2.27\n' "$MAXGLIBC" | sort -V | tail -1)" != "GLIBC_2.27" ]; then
            echo "::error::SARndbox needs $MAXGLIBC but Ubuntu 18.04 has GLIBC_2.27;" \
                 "the build did not run in the bionic container."
            exit 1
          fi

      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse HEAD)
          ln -s /opt/arsandbox/bin/sandbox-control stageroot/usr/bin/sandbox-control
          fpm -s dir -t deb -n arsandbox -v "$VERSION+qt5" \
            --maintainer "Domagoj Milardovic <domagoj.milardovic@gmail.com>" \
            --license GPL-2.0 --url https://github.com/${{ github.repository }} \
            --description "Augmented Reality Sandbox: Kinect depth camera + projector topography, prebuilt with Vrui and the Kinect package (Qt 5 build, for Ubuntu 18.04 and 20.04; git ${COMMIT::7})" \
            --depends libudev1 --depends libdbus-1-3 --depends libusb-1.0-0 \
            --depends zlib1g --depends libssl1.1 --depends libpng16-16 \
            --depends libjpeg-turbo8 --depends libtiff5 --depends libasound2 \
            --depends libspeex1 --depends libopenal1 --depends libv4l-0 \
            --depends libdc1394-22 --depends libtheora0 --depends libbluetooth3 \
            --depends libfreetype6 --depends libxi6 --depends libxrandr2 \
            --depends libgl1 --depends libglu1-mesa --depends fonts-freefont-ttf \
            --depends libqt5quick5 --depends libqt5qml5 --depends qml-module-qtquick2 \
            --depends qml-module-qtquick-controls2 --depends qml-module-qtquick-layouts \
            --depends qml-module-qtquick-window2 --depends qml-module-qtquick-templates2 \
            --depends qml-module-qt-labs-settings \
            --config-files /opt/arsandbox/etc/SARndbox-2.8 \
            --after-install packaging/udev-reload.sh --after-remove packaging/udev-reload.sh \
            -C stageroot opt usr

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arsandbox-qt5-deb
          path: '*.deb'

  package-rpm:
    name: Package (.rpm)
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          dnf install -y gcc-c++ cmake ninja-build git wget rpm-build redhat-rpm-config \
            systemd-devel dbus-devel libusbx-devel zlib-devel openssl-devel \
            libpng-devel libjpeg-turbo-devel libtiff-devel alsa-lib-devel speex-devel \
            openal-soft-devel libv4l-devel libdc1394-devel libtheora-devel bluez-libs-devel \
            freetype-devel libXi-devel libXrandr-devel mesa-libGL-devel mesa-libGLU-devel \
            gnu-free-mono-fonts gnu-free-sans-fonts gnu-free-serif-fonts \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            ruby ruby-devel rubygems
          gem install --no-document fpm

      - name: Determine toolchain version for cache key
        id: toolchain
        run: echo "gcc=$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache Vrui/Kinect build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: stageroot.src
          key: vrui-kinect-${{ runner.os }}-gcc${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('packaging/build.sh') }}

      - name: Build and stage
        run: STAGEROOT="$PWD/stageroot" bash packaging/build.sh

      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse HEAD)
          ln -s /opt/arsandbox/bin/sandbox-control stageroot/usr/bin/sandbox-control
          fpm -s dir -t rpm -n arsandbox -v "$VERSION" \
            --license GPLv2 --url https://github.com/${{ github.repository }} \
            --description "Augmented Reality Sandbox: Kinect depth camera + projector topography, prebuilt with Vrui and the Kinect package (git ${COMMIT::7})" \
            --depends systemd-libs --depends dbus-libs --depends libusbx \
            --depends zlib --depends openssl-libs --depends libpng \
            --depends libjpeg-turbo --depends libtiff --depends alsa-lib \
            --depends speex --depends openal-soft --depends libv4l \
            --depends libdc1394 --depends libtheora --depends bluez-libs \
            --depends freetype --depends libXi --depends libXrandr \
            --depends mesa-libGL --depends mesa-libGLU \
            --depends gnu-free-mono-fonts --depends gnu-free-sans-fonts --depends gnu-free-serif-fonts \
            --depends qt6-qtdeclarative \
            --config-files /opt/arsandbox/etc/SARndbox-2.8 \
            --after-install packaging/udev-reload.sh --after-remove packaging/udev-reload.sh \
            -C stageroot opt usr

      - name: Sign the .rpm
        # Embedded signature, so `rpm -K` and dnf can check it once the user has
        # imported arsandbox-signing-key.asc from the release. The .deb has no
        # equivalent apt checks; SHA256SUMS.asc in the release job covers it.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }
          dnf install -y rpm-sign gnupg2
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          PASSFILE=$(mktemp)
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"
          rpmsign --addsign --define "_gpg_name $KEYID" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $PASSFILE" \
            ./*.rpm
          rm -f "$PASSFILE"
          # Prove the signature verifies against the public half before shipping.
          gpg --armor --export "$KEYID" > signing-key.asc
          rpm --import signing-key.asc
          rpm -K ./*.rpm | tee /dev/stderr | grep -q 'signatures OK'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arsandbox-rpm
          path: '*.rpm'

  release:
    name: Publish
    needs: [source, package-deb, package-deb-qt5, package-rpm]
    runs-on: ubuntu-22.04
    # A tag push, or a manual run naming a tag: both publish. Previously the
    # manual path built the branch it was started from, labelled the result
    # with the tag's version and then published nothing.
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Sign the checksums
        # One signature over every file's SHA-256, so the .deb and the source
        # tarball are covered too. download-artifact nests each artifact in its
        # own directory; flatten first so SHA256SUMS names files as users get them.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          cd dist
          sha256sum -- * > SHA256SUMS
          PASSFILE=$(mktemp)
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"
          gpg --batch --pinentry-mode loopback --passphrase-file "$PASSFILE" \
            --local-user "$KEYID" --armor --detach-sign SHA256SUMS
          rm -f "$PASSFILE"
          gpg --armor --export "$KEYID" > arsandbox-signing-key.asc
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: dist/*
          generate_release_notes: true
          body: |
            Built from commit `${{ needs.source.outputs.commit }}`. Every package's description
            carries the same short hash, and `sandbox-control --version` on an
            installed machine reports the tag it was built from.

            ## Installing

            Download `arsandbox-source.tar.gz`, unpack it and run:

            ```bash
            ./install.sh
            ```

            That installs the build dependencies, builds and installs Vrui and
            its Kinect package if they are not already present, then builds the
            sandbox and the control panel. Vrui is built from the author's
            release rather than vendored here.

            Prefer not to build locally? Download `arsandbox_<version>_amd64.deb`
            (Ubuntu 24.04 and newer) or `arsandbox-<version>.x86_64.rpm`
            (Fedora 40 and newer) instead. Each bundles the whole app — Vrui,
            the Kinect package, the sandbox and the control panel — under
            `/opt/arsandbox`, with `arsandbox` and `sandbox-control` on your
            PATH:

            ```bash
            sudo apt install ./arsandbox_<version>_amd64.deb   # Ubuntu 24.04+
            sudo dnf install ./arsandbox-<version>.x86_64.rpm  # Fedora 40+
            ```

            On Ubuntu 18.04 or 20.04 — and derivatives such as Linux Mint 19
            and 20 — use the Qt 5 build instead. It is built on 18.04, so it
            needs only that release's glibc and libraries:

            ```bash
            sudo apt install ./arsandbox_<version>+qt5_amd64.deb
            ```

            Each package is built on the oldest release it claims, and depends
            on that release's library names, so it will not install on a
            release older than the one listed. Ubuntu 22.04 falls between the
            two packages — it renamed `libssl1.1` to `libssl3`, which the Qt 5
            build needs, but predates the `t64` names the Qt 6 build needs — so
            on 22.04, and on anything not listed above, build from source with
            `./install.sh`, which adapts to whichever Qt and library versions
            your distribution actually ships.

            **Upgrading a machine that once ran `install.sh`:** that left a
            `sandbox-control` and `KinectUtil` in `/usr/local/bin`, which
            precedes the package's `/usr/bin` on PATH. The packaged `arsandbox`
            launcher now runs the copies under `/opt/arsandbox/bin` regardless,
            but if you start `sandbox-control` by hand, check
            `sandbox-control --version` says this tag and not something older.

            The calibration is saved under `/opt/arsandbox/etc` and is kept
            across upgrades. If the installer could not tell which user runs the
            sandbox (e.g. an unattended install), the first `arsandbox` launch
            asks for your password once to hand those directories over.

            ## Verify the download

            Every release is signed by Domagoj Milardovic. Check the files you
            downloaded before installing:

            ```bash
            gpg --import arsandbox-signing-key.asc
            gpg --verify SHA256SUMS.asc SHA256SUMS
            sha256sum -c --ignore-missing SHA256SUMS
            ```

            The `.rpm` also carries an embedded signature:
            `sudo rpm --import arsandbox-signing-key.asc && rpm -K arsandbox-*.rpm`.
            A key shipped beside the files only proves they match each other;
            check its fingerprint (`gpg --show-keys arsandbox-signing-key.asc`)
            against one you got from the maintainer directly.

            Like the rest of this workflow, the packages are built without a
            Kinect attached and are not hardware-tested in CI; if one doesn't
            work on your machine, `install.sh` is the fallback.
